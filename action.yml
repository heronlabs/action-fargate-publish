name: action-fargate-publish

author: Heron Labs

description: Trigger a new ECS Fargate deployment by forcing a rolling update on an existing service.

inputs:
  AWS_ROLE_TO_ASSUME:
    description: ARN of the IAM role to assume via OIDC.
    required: true
  AWS_REGION:
    description: AWS region where the ECS cluster lives.
    required: true
  AWS_ROLE_DURATION_SECONDS:
    description: Duration in seconds for the assumed role session.
    required: true
  CLUSTER_NAME:
    description: Name of the ECS cluster hosting the service.
    required: true
  SERVICE_NAME:
    description: Name of the ECS service to redeploy.
    required: true

runs:
  using: composite
  steps:
    - name: 'Configure AWS Credentials'
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
      with:
        aws-region: ${{ inputs.AWS_REGION }}
        role-to-assume: ${{ inputs.AWS_ROLE_TO_ASSUME }}
        role-duration-seconds: ${{ inputs.AWS_ROLE_DURATION_SECONDS }}
        role-session-name: action-fargate-publish-session

    - name: 'Force new deployment'
      shell: bash
      run: bash ${{ github.action_path }}/core/publish-fargate.sh
      env:
        CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}
        SERVICE_NAME: ${{ inputs.SERVICE_NAME }}
