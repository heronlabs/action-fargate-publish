name: publish-fargate-action

author: Heronlabs

description: Publish Fargate

inputs:
  AWS_ACCESS_KEY_ID:
    description: inputs.AWS_ACCESS_KEY_ID
    required: true
  AWS_SECRET_ACCESS_KEY:
    description: inputs.AWS_SECRET_ACCESS_KEY
    required: true
  AWS_ROLE_TO_ASSUME:
    description: inputs.AWS_ROLE_TO_ASSUME
    required: true
  AWS_REGION:
    description: inputs.AWS_REGION
    required: true
  AWS_ROLE_DURATION_SECONDS:
    description: inputs.AWS_ROLE_DURATION_SECONDS
    required: true
  CLUSTER_NAME:
    description: inputs.CLUSTER_NAME
    required: true
  SERVICE_NAME:
    description: inputs.SERVICE_NAME
    required: true

runs:
  using: composite
  steps:
    - name: '[PUBLISH] | Configure AWS Credentials'
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-region: ${{ inputs.AWS_REGION }}
        aws-access-key-id: ${{ inputs.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        role-to-assume: ${{ inputs.AWS_ROLE_TO_ASSUME }}
        role-duration-seconds: ${{ inputs.AWS_ROLE_DURATION_SECONDS }}
        role-session-name: publish-iac-action-session

    - name: '[PUBLISH] | Publish new deployment'
      shell: bash
      run: |
         chmod +x ./publish-fargate-action/core/publish-fargate.sh
         ./publish-fargate-action/core/publish-fargate.sh
      env:
        CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}
        SERVICE_NAME:  ${{ inputs.SERVICE_NAME }}
